name: Build OffsetDumper IPA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP=build/Payload/OffsetDumper.app
          mkdir -p "$APP"
          xcrun --sdk iphoneos swiftc App.swift \
            -sdk "$SDK" -target arm64-apple-ios14.0 \
            -O -parse-as-library -lc++ \
            -o "$APP/OffsetDumper"
          cp Info.plist "$APP/Info.plist"
          codesign -f -s - "$APP"
          cd build && zip -qry OffsetDumper.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OffsetDumper.ipa
          path: build/OffsetDumper.ipa
