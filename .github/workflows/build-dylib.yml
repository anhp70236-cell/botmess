name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Compile VoiceMod.dylib (arm64)
        run: |
          mkdir -p build
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -std=c++17 \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -install_name "@executable_path/Frameworks/VoiceMod.dylib" \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            src/PatchEngine.mm \
            src/VoiceModManager.mm \
            src/ModMenuUI.mm \
            src/TweakEntry.mm \
            -o build/VoiceMod.dylib

          ldid -S build/VoiceMod.dylib 2>/dev/null || codesign -f -s - build/VoiceMod.dylib
          file build/VoiceMod.dylib

      - name: Upload VoiceMod.dylib
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMod-iOS-arm64
          path: build/VoiceMod.dylib
