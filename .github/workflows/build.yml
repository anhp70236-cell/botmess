name: Build VoiceFX
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tai fishhook
        run: |
          curl -fsSL -o src/fishhook.c https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          curl -fsSL -o src/fishhook.h https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h
      - name: Build dylib
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceFX-dylib
          path: build/VoiceFX.dylib
