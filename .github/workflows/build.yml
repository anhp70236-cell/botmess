name: Build RioMenu dylib
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Dobby (iOS arm64)
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git
          cmake -S Dobby -B Dobby/build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_GENERATE_SHARED=OFF
          cmake --build Dobby/build -j4
          find Dobby/build -name "libdobby.a"

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          LIB=$(find Dobby/build -name "libdobby.a" | head -n1)
          clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -dynamiclib -fobjc-arc -std=c++17 -x objective-c++ \
            -IDobby/include \
            -framework UIKit -framework Foundation -framework QuartzCore \
            Tweak.mm "$LIB" -lc++ \
            -o RioMenu.dylib
          codesign -f -s - RioMenu.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: RioMenu.dylib
          path: RioMenu.dylib
