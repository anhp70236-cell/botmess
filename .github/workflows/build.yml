name: Build NoAds dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib (arm64 iOS)
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=12.0 \
            -dynamiclib -O2 -fvisibility=hidden \
            -install_name @rpath/NoAds.dylib \
            -o build/NoAds.dylib src/NoAds.c
          codesign -f -s - build/NoAds.dylib
          file build/NoAds.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: NoAds-dylib
          path: build/NoAds.dylib
