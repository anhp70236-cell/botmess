name: Build TikTok ChestMenu IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Link tải trực tiếp TikTok.ipa (đã decrypt)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -fobjc-arc -fmodules -dynamiclib \
            -framework UIKit -framework Foundation \
            -install_name @rpath/ChestMenu.dylib \
            -o ChestMenu.dylib ChestMenu.m
          codesign -f -s - ChestMenu.dylib

      - name: Tải TikTok.ipa
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: curl -L --fail --retry 3 -o TikTok.ipa "$IPA_URL"

      - name: Nhúng dylib vào IPA
        run: |
          set -e
          git clone --depth 1 https://github.com/Tyilo/insert_dylib.git
          clang -o insert_dylib_bin "$(find insert_dylib -name main.c | head -1)"
          unzip -q TikTok.ipa -d work
          APP=$(ls -d work/Payload/*.app | head -1)
          EXE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")
          mkdir -p "$APP/Frameworks"
          cp ChestMenu.dylib "$APP/Frameworks/ChestMenu.dylib"
          ./insert_dylib_bin --inplace --strip-codesign --all-yes \
            "@executable_path/Frameworks/ChestMenu.dylib" "$APP/$EXE"
          (cd work && zip -qry ../TikTok_ChestMenu.ipa Payload)
          ls -lh TikTok_ChestMenu.ipa

      - name: Đưa IPA lên Releases (tải nhanh hơn Artifacts)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chestmenu-${{ github.run_number }}
          name: TikTok ChestMenu #${{ github.run_number }}
          files: TikTok_ChestMenu.ipa

      - name: Lưu riêng file dylib (nhẹ)
        uses: actions/upload-artifact@v4
        with:
          name: ChestMenu-dylib
          path: ChestMenu.dylib
