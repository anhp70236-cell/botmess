name: Build ChestMenu dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra file nguồn
        run: |
          if [ ! -f ChestMenu.m ]; then
            echo "::error::Không thấy ChestMenu.m ở thư mục gốc repo. Hãy upload ChestMenu.m ngang hàng với thư mục .github"
            ls -la
            exit 1
          fi

      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=13.0 \
            -fobjc-arc -fmodules -dynamiclib \
            -framework UIKit -framework Foundation \
            -install_name @rpath/ChestMenu.dylib \
            -o ChestMenu.dylib ChestMenu.m
          codesign -f -s - ChestMenu.dylib
          ls -lh ChestMenu.dylib

      - name: Lưu file dylib (nhẹ, tải trong vài giây)
        uses: actions/upload-artifact@v4
        with:
          name: ChestMenu-dylib
          path: ChestMenu.dylib
          if-no-files-found: error
