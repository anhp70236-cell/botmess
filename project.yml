name: DEVNVIOS
options:
  bundleIdPrefix: com.devnvios
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "3"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  DEVNVIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DEVNVIOS
        excludes:
          - "Tests/**"
          - "GitHub/**"
          - "Resources/Info.plist"
          - "Resources/DEVNVIOS-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devnvios.ipaanalyzer
        PRODUCT_NAME: DEVNVIOS
        INFOPLIST_FILE: DEVNVIOS/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: DEVNVIOS/Resources/DEVNVIOS-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: libz.tbd

  DEVNVIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DEVNVIOS/Tests
    dependencies:
      - target: DEVNVIOS
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devnvios.ipaanalyzer.tests
        SWIFT_OBJC_BRIDGING_HEADER: DEVNVIOS/Resources/DEVNVIOS-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DEVNVIOS:
    build:
      targets:
        DEVNVIOS: all
        DEVNVIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DEVNVIOSTests
    archive:
      config: Release
