function scallop(el, r, fill, stroke, sw){
var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");

for (i = 1; i < ny; i++){ pts.push([r, r + bh*i/ny]); pts.push([W - r, r + bh*i/ny]); }
var s = '<rect x="' + r + '" y="' + r + '" width="' + bw + '" height="' + bh + '"/>' +
pts.map(function(p){ return '<circle cx="' + p[0].toFixed(2) + '" cy="' + p[1].toFixed(2) + '" r="' + r + '"/>'; }).join("");
svg.setAttribute("viewBox", "0 0 " + W + " " + H);
svg.innerHTML = '<g fill="' + stroke + '" stroke="' + stroke + '" stroke-width="' + sw*2 + '" stroke-linejoin="round">' + s + '</g><g fill="' + fill + '">' + s + '</g>';

  hearts.className = "intro-hearts";

  for (i = 0; i < HEARTS.length; i++){
    var h = HEARTS[i];
    html += '<svg viewBox="0 0 24 24" width="' + h[2] + '" height="' + h[2] + '" style="left:' + h[0] + '%;top:' + h[1] + '%;animation-delay:' + h[3] + 's;animation-duration:' + h[4] + 's"><path fill="' + h[5] + '" d="' + HEART_PATH + '"/></svg>';
  }
  hearts.innerHTML = html;
  document.body.appendChild(hearts);
  document.body.appendChild(box);
}
function place(){
  if (!box) return false;
  var ws = find(), L = 1e9, R = -1e9, B = -1e9, k = 0, r, i;
  for (i = 0; i < ws.length; i++){
    r = ws[i].getBoundingClientRect();
    if (!r.width) continue;
    L = Math.min(L, r.left); R = Math.max(R, r.right); B = Math.max(B, r.bottom); k++;
  }
  if (!k) return false;
  var hd = leafMatch(HANDLE_RE), pl = leafMatch(PILL_RE);
  var hr = hd ? hd.getBoundingClientRect() : null;
  var pr = pl ? pillRect(pl) : null;
  var cr = hd ? cardRect(hd) : null;

  /* vung trong ben phai: sau ten/Offline, truoc mep the */
  var left = Math.max(hr ? hr.right : 0, pr ? pr.right : 0) + 14;
  if (!hr && !pr) left = L - 20;
  var right = Math.min(innerWidth - 12, cr ? cr.right - 14 : R - 24);
  if (right - left < 90) left = right - 90;
  var w = right - left;

  /* tu co chu cho vua vung, khong bi thua / tran */
  box.style.width = w + "px";
  box.style.fontSize = "13px";
  var ls = box.querySelectorAll(".il"), maxW = 0;
  for (i = 0; i < ls.length; i++) maxW = Math.max(maxW, ls[i].getBoundingClientRect().width);
  var fs = 13;
  if (maxW > w) fs = Math.max(9.5, 13 * w / maxW * 0.98);
  box.style.fontSize = fs.toFixed(2) + "px";
  var bh = box.getBoundingClientRect().height;

  /* canh giua theo chieu doc trong khoang tu day logo den day nut Offline */
  var bandTop = B + 6, bandBottom = pr ? pr.bottom : bandTop + 90;
  var top = bandTop + Math.max(0, (bandBottom - bandTop - bh) / 2);

  box.style.left = (left + pageXOffset) + "px";
  box.style.top = (top + pageYOffset) + "px";
  var a = box.getBoundingClientRect();   /* hieu chinh neu body bi lech */
  box.style.left = (left + pageXOffset + (left - a.left)) + "px";
  box.style.top = (top + pageYOffset + (top - a.top)) + "px";

  hearts.style.width = w + "px";
  hearts.style.height = bh + "px";
  hearts.style.left = box.style.left;
  hearts.style.top = box.style.top;
  return true;
}
function turnOn(){
  if (place()){ box.classList.add("on"); hearts.classList.add("on"); }
}
function showIntro(){
  want = true;
  build();
  turnOn();
  var n = 0, tm = setInterval(function(){
    turnOn();
    if (++n > 16) clearInterval(tm);
  }, 500);
  setInterval(function(){ if (want) place(); }, 1500);

}
addEventListener("resize", function(){ if (want) place(); });
addEventListener("orientationchange", function(){ setTimeout(function(){ if (want) place(); }, 300); });

/* ---------- canh dung luc man hinh Got it vua bien mat ---------- */
function effOpacity(e){
  var o = 1, cs;
  while (e && e.nodeType === 1){
    cs = getComputedStyle(e);
    if (cs.display === "none") return 0;
    o *= parseFloat(cs.opacity);
    e = e.parentElement;
  }
  return o;
}
function gateGone(){
  if (!ok.isConnected) return true;
  if (getComputedStyle(ok).visibility === "hidden") return true;
  var r = ok.getBoundingClientRect();
  if (!r.width || !r.height) return true;
  if (r.bottom <= 0 || r.top >= innerHeight || r.right <= 0 || r.left >= innerWidth) return true;
  return effOpacity(ok) < 0.35;
}
var revealed = false;

  showIntro();
}
ok.addEventListener("click", function(){

<script>
/* smooth-fix-v12: dem luot xem that (moi IP chi tinh 1 lan, server luu vinh vien) */
(function(){

var LABEL = "views";        /* chu hien ra khi bam vao */

if (!ok) return;

var tok = "", tokAt = 0, count = null, revealed = false, posted = false, openT = null;

pill.type = "button";

(function(){   /* dung chung font voi chu @ cua trang */
  var els = document.querySelectorAll("div,p,span,small,a,b,strong"), i, t;
  for (i = 0; i < els.length; i++){
    if (els[i].children.length || els[i].closest(".vcount")) continue;
    t = (els[i].textContent || "").trim();
    if (/^@\S+$/.test(t)){ pill.style.fontFamily = getComputedStyle(els[i]).fontFamily; return; }
  }
})();

function fmt(n){ try{ return Number(n).toLocaleString("en-US"); }catch(e){ return String(n); } }
function sync(){ if (revealed && count !== null) pill.classList.add("on"); }
function render(n, isNew){
  count = n;
  numEl.textContent = fmt(n);
  if (isNew){ numEl.classList.remove("pop"); void numEl.offsetWidth; numEl.classList.add("pop"); }
  sync();
}
function api(method, body){
  var opt = {method: method, credentials: "same-origin", cache: "no-store"};
  if (body){ opt.headers = {"Content-Type": "application/x-www-form-urlencoded"}; opt.body = body; }
  return fetch(API + (method === "GET" ? "?_=" + Date.now() : ""), opt).then(function(r){ return r.json(); });
}
function refresh(cb){
  api("GET").then(function(d){
    if (d && d.tok){ tok = d.tok; tokAt = Date.now(); }
    if (d && typeof d.count === "number" && !posted) render(d.count, false);
    if (cb) cb();
  }).catch(function(){ if (cb) cb(); });
}
function post(tries){
  var wait = Math.max(0, 1300 - (Date.now() - tokAt));   /* server yeu cau the phai du 1 giay tuoi */
  setTimeout(function(){
    api("POST", "tok=" + encodeURIComponent(tok)).then(function(d){
      if (d && typeof d.count === "number") render(d.count, !!d.counted);
      if (d && d.counted === false && d.why === "token" && tries < 1) refresh(function(){ post(tries + 1); });
    }).catch(function(){});
  }, wait);
}

/* bam vao vien thuoc -> hien chu "views", tu thu lai sau 2.6 giay */
pill.addEventListener("click", function(){
  clearTimeout(openT);
  if (pill.classList.contains("open")){ pill.classList.remove("open"); return; }
  pill.classList.add("open");
  openT = setTimeout(function(){ pill.classList.remove("open"); }, 2600);
});

/* ---------- hien vien thuoc khi man hinh Got it vua bien mat ---------- */
function effOpacity(e){
  var o = 1, cs;
  while (e && e.nodeType === 1){
    cs = getComputedStyle(e);
    if (cs.display === "none") return 0;
    o *= parseFloat(cs.opacity);
    e = e.parentElement;
  }
  return o;
}
function gateGone(){
  if (!ok.isConnected) return true;
  if (getComputedStyle(ok).visibility === "hidden") return true;
  var r = ok.getBoundingClientRect();
  if (!r.width || !r.height) return true;
  if (r.bottom <= 0 || r.top >= innerHeight || r.right <= 0 || r.left >= innerWidth) return true;
  return effOpacity(ok) < 0.35;
}
function reveal(){ if (revealed) return; revealed = true; sync(); }

refresh();   /* lay so luot xem hien tai ngay khi vao trang (chua tinh them) */

ok.addEventListener("click", function(e){
  /* chi tinh khi la cu cham that cua nguoi dung, khong phai bot/script */
  if (e && e.isTrusted === false) return;
  if (navigator.webdriver) return;
  if (!posted){
    posted = true;
    if (tok) post(0); else refresh(function(){ post(0); });
  }
  var t0 = Date.now();
  (function tick(){
    if (gateGone() || Date.now() - t0 > 1800){ reveal(); return; }
    setTimeout(tick, 40);
  })();
});
/* trang khong co man hinh Got it: van hien so luot xem, nhung khong tinh them */
setTimeout(function(){ if (!revealed && gateGone()) reveal(); }, 1200);
setTimeout(function(){ if (!revealed && gateGone()) reveal(); }, 3000);
})();
</script>
